[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "app-watch"
version = "0.1.0"
description = "Watch application shutdown and trigger external commands"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "psutil>=6.1,<8",
    "pydantic>=2.10,<3",
    "ruamel.yaml>=0.18.16,<0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
app-watch = "app_watch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/app_watch"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/systemd", "/scripts", "/install.sh", "/requirements.in", "/requirements.lock", "/docs", "/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
