# Disabled template: replace paths with this installation's observed process identity.
# Review every GUI/daemon writer; these entrypoints are not verified presets.
config_version: 1
job:
  id: bisq-main
application:
  name: bisq
  data_dir: ~/.local/share/Bisq
  matcher:
    entrypoints:
      - kind: script
        value: /opt/bisq/bin/Bisq
      - kind: java_main
        value: bisq.desktop.app.BisqAppMain
      - kind: java_main
        value: bisq.daemon.app.BisqDaemonMain
      - kind: jar
        value: /opt/bisq-daemon/daemon.jar
    argv_tokens: []
    env_eq: {}
action:
  # Harmless example, not a backup: replace with your external command's argv.
  argv: [/usr/bin/printf, '%s\n', 'bisq shutdown confirmed']
trigger:
  enabled: false
  poll_seconds: 2
  confirm_seconds: 5
  # deadline_seconds: 3600  # Advisory only; never terminates an action.
  params: {}
desktop_notifications:
  command: notify-send
  timeout_ms: 5000
  trigger:
    enabled: false
# external_notifier:
#   command: telegram-notify
#   timeout_seconds: 15
logging:
  level: info
  include_command_output: false
